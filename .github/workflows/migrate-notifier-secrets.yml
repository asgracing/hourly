name: One-time encrypted notifier secret migration

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/migrate-notifier-secrets.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt notification credentials for the VPS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VPS_PUBLIC_KEY_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$VPS_PUBLIC_KEY_B64" | base64 --decode > public.pem
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          values = {
              "TELEGRAM_BOT_TOKEN": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "TELEGRAM_CHAT_ID": os.environ.get("TELEGRAM_CHAT_ID", ""),
              "DISCORD_WEBHOOK_URL": os.environ.get("DISCORD_WEBHOOK_URL", ""),
          }
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit("missing GitHub secrets: " + ", ".join(missing))
          plaintext = json.dumps(values, separators=(",", ":")).encode()
          if len(plaintext) > 430:
              raise SystemExit("secret bundle is unexpectedly large")
          encrypted = subprocess.check_output(
              [
                  "openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "public.pem",
                  "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
              ],
              input=plaintext,
          )
          print("ASG_MIGRATION_CIPHERTEXT=" + base64.b64encode(encrypted).decode())
          PY
